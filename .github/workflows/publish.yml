name: Publish to npm

on:
  push:
    branches:
      - develop

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pendingspark'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check if version needs bumping
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "needs_bump=false" >> $GITHUB_OUTPUT
          else
            echo "needs_bump=true" >> $GITHUB_OUTPUT
          fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        if: steps.check_version.outputs.needs_bump == 'true'
        run: |
          npm version patch -m "chore: bump version to %s [skip ci]"
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Set version for existing tag
        if: steps.check_version.outputs.needs_bump == 'false'
        run: |
          echo "NEW_VERSION=${{ steps.check_version.outputs.current_version }}" >> $GITHUB_ENV

      - name: Push changes
        if: steps.check_version.outputs.needs_bump == 'true'
        run: |
          git push origin develop --follow-tags

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.needs_bump == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_version.outputs.needs_bump == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEW_VERSION }}
          release_name: Release v${{ env.NEW_VERSION }}
          body: |
            Automated release v${{ env.NEW_VERSION }}
          draft: false
          prerelease: false
